name: build and publish (android, iOS)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Android
            build-os: ubuntu-latest
            directory: android
          - os: iOS
            build-os: macos-26
            directory: ios
    name: Build ${{ matrix.os }} App and Upload
    runs-on: ${{ matrix.build-os }}
    concurrency:
      group: mobile-upload-${{ matrix.os }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - uses: shimataro/ssh-key-action@v2.7.0
        if: matrix.os == 'iOS'
        with:
          key: ${{ secrets.CERTIFICATION_DEPLOY_KEY }}
          known_hosts: unnecessary

      - name: Write keystore
        if: matrix.os == 'Android'
        run: |
          echo "$KEYSTORE" | base64 --decode > ./android/app/upload-keystore.jks
          echo "$KEYSTORE_PROPERTIES" > ./android/key.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
      - uses: actions/setup-java@v4
        if: matrix.os == 'Android'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
          working-directory: ${{ matrix.directory }}

      - name: Build web and sync native project
        env:
          VITE_AMPLITUDE_API_KEY: ${{ secrets.VITE_AMPLITUDE_API_KEY }}
          VITE_IDP_CLIENT_ID: ${{ secrets.VITE_IDP_CLIENT_ID }}
          SWAGGER_URL: ${{ secrets.SWAGGER_URL }}
          SWAGGER_USER: ${{ secrets.SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
        run: |
          bun install --frozen-lockfile
          bun run build -- --mode production
          bunx cap sync ${{ matrix.directory }}

      - name: Run fastlane
        run: bundle exec fastlane internal
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          SLACK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPPLY_JSON_KEY_DATA: ${{ secrets.SUPPLY_JSON_KEY_DATA }}
        working-directory: ${{ matrix.directory }}

      - name: action-slack
        uses: 8398a7/action-slack@v3
        if: ${{ failure() || cancelled() }}
        with:
          status: ${{ job.status }}
          author_name: Github Action Build
          mention: ${{ secrets.SLACK_MENTION }}
          if_mention: 'failure,cancelled'
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
