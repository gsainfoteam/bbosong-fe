name: mobile build test (android, iOS)

on:
  pull_request:
    branches:
      - main
    paths:
      - android/**
      - ios/**
      - package.json
      - bun.lock
      - capacitor.config.ts
      - .github/workflows/mobile-*.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Android
            build-os: ubuntu-latest
            directory: android
          - os: iOS
            build-os: macos-26
            directory: ios
    name: Build ${{ matrix.os }} App
    runs-on: ${{ matrix.build-os }}
    concurrency:
      group: mobile-test-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        if: matrix.os == 'Android'
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
          working-directory: ${{ matrix.directory }}

      - name: Build web and sync native project
        env:
          VITE_AMPLITUDE_API_KEY: ${{ secrets.VITE_AMPLITUDE_API_KEY }}
          VITE_IDP_CLIENT_ID: ${{ secrets.VITE_IDP_CLIENT_ID }}
          SWAGGER_URL: ${{ secrets.SWAGGER_URL }}
          SWAGGER_USER: ${{ secrets.SWAGGER_USER }}
          SWAGGER_PASSWORD: ${{ secrets.SWAGGER_PASSWORD }}
        run: |
          bun install --frozen-lockfile
          bun run build -- --mode production
          bunx cap sync ${{ matrix.directory }}

      - name: Run fastlane
        run: bundle exec fastlane test
        working-directory: ${{ matrix.directory }}
